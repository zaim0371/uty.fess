<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menfess UTY</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#dff0fc;--bg2:#fde9f1;--card:#fff;--ink:#26405e;--mut:#6b86a3;--sky:#4a9fdc;--sky2:#3589c7;--pink:#ffc2d9;--line:#cfe5f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16273a;--bg2:#2a2030;--card:#1f3248;--ink:#e8f1fa;--mut:#9fb6cc;--line:#34506b}}
:root[data-theme="dark"]{--bg1:#16273a;--bg2:#2a2030;--card:#1f3248;--ink:#e8f1fa;--mut:#9fb6cc;--line:#34506b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Nunito,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 18px 40px}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:30px;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mut);font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:transparent;outline:none}
textarea:focus-visible,button:focus-visible,label:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cnt{font-size:13px;color:var(--mut)}
button,.ghost{font:inherit;font-weight:700;border-radius:999px;padding:12px 22px;border:0;cursor:pointer}
.go{background:var(--sky);color:#fff;flex:1}
.go:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:13px;padding:8px 14px;font-weight:600}
.ghost input{display:none}
.prev{margin-top:18px;text-align:center}
.prev img{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px;color:var(--ink);background:transparent;outline:none;min-width:0}
input[type=text]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;min-width:0;padding:10px 6px;font-size:14px;background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.chip[aria-checked=true]{background:var(--sky);border-color:var(--sky);color:#fff}
.chip:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Menfess UTY</h1>
  <p class="sub">Tempel teks menfess, lalu simpan gambarnya.</p>
  <div class="box">
    <div class="chips" role="radiogroup" aria-label="Pilih desain"><button class="chip" role="radio" aria-checked="true" data-d="a">Langit</button><button class="chip" role="radio" aria-checked="false" data-d="b">Pink Lembut</button><button class="chip" role="radio" aria-checked="false" data-d="c">Putih Bersih</button></div>
    <div class="two"><input type="text" id="f" maxlength="40" placeholder="from: (opsional)" aria-label="from"><input type="text" id="o" maxlength="40" placeholder="to: (opsional)" aria-label="to"></div>
    <textarea id="t" maxlength="600" placeholder="Tempel atau tulis menfess di sini…"></textarea>
    <div class="row">
      <span class="cnt" id="c">0 / 600</span>
    </div>
    <div class="row"><button class="go" id="save" disabled>Simpan gambar</button></div>
  </div>
  <div class="prev" id="pv" hidden>
    <img id="im" alt="Pratinjau gambar menfess">
    <p class="hint">Jika tombol simpan tidak muncul, tahan gambar lalu pilih simpan.</p>
  </div>
</main>

function spark(cx,cy,r,a,col){x.save();x.translate(cx,cy);x.globalAlpha=a;x.fillStyle=col||'#fff';x.beginPath();
 for(let i=0;i<8;i++){const ang=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;x.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}x.closePath();x.fill();x.restore()}

function drawLogo(cx,cy,R){
 x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
 if(logoImg){const s=Math.max(2*R/logoImg.width,2*R/logoImg.height)*1.04;x.drawImage(logoImg,cx-logoImg.width*s/2,cy-logoImg.height*s/2,logoImg.width*s,logoImg.height*s);x.restore();ring(cx,cy,R);return}
 x.fillStyle=NAVY;x.fillRect(cx-R,cy-R,2*R,2*R);
 // matahari
 const sg=x.createLinearGradient(0,cy,0,cy+R);sg.addColorStop(0,'#ffd23f');sg.addColorStop(1,'#ff8a2a');
 x.fillStyle=sg;x.beginPath();x.arc(cx,cy+R*.62,R*.5,Math.PI,0);x.fill();
 // globe
 const gr=R*.5,gy=cy+R*.06;
 const g=x.createLinearGradient(cx-gr,gy-gr,cx+gr,gy+gr);g.addColorStop(0,'#fff');g.addColorStop(1,'#5aa7e6');
 x.fillStyle=g;x.beginPath();x.arc(cx,gy,gr,0,7);x.fill();
 x.strokeStyle='#2f78c4';x.lineWidth=R*.025;
 x.beginPath();x.ellipse(cx,gy,gr*.45,gr,0,0,7);x.stroke();
 x.beginPath();x.moveTo(cx,gy-gr);x.lineTo(cx,gy+gr);x.moveTo(cx-gr,gy);x.lineTo(cx+gr,gy);x.stroke();
 // orbit atom
 x.strokeStyle='#e5322d';x.lineWidth=R*.055;
 [-35,35].forEach(d=>{x.beginPath();x.ellipse(cx,gy,gr*1.28,gr*.45,d*Math.PI/180,0,7);x.stroke()});
 x.restore();
 // bintang emas
 x.save();x.fillStyle='#f6c62b';x.beginPath();
 for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?R*.07:R*.16;x.lineTo(cx+Math.cos(a)*rr,cy-R*.66+Math.sin(a)*rr)}
 x.closePath();x.fill();x.restore();
 ring(cx,cy,R);
}
function ring(cx,cy,R){x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke()}

function envelope(cx,cy,w,h,rot,col){
 x.save();x.translate(cx,cy);x.rotate(rot);x.strokeStyle=col||'#fff';x.lineWidth=5;x.lineJoin='round';x.lineCap='round';
 x.beginPath();x.roundRect(-w/2,-h/2,w,h,10);x.stroke();
 x.beginPath();x.moveTo(-w/2+4,-h/2+6);x.lineTo(0,h*.1);x.lineTo(w/2-4,-h/2+6);x.stroke();x.restore()}

function corner(){
 x.save();x.fillStyle=PINK;
 x.globalAlpha=.55;x.beginPath();x.arc(W,0,300,0,7);x.fill();
 x.globalAlpha=.35;x.fillStyle='#fff';x.beginPath();x.arc(W,0,210,0,7);x.fill();
 x.globalAlpha=.55;x.fillStyle=PINK;x.beginPath();x.arc(0,H,300,0,7);x.fill();
 x.globalAlpha=.35;x.fillStyle='#fff';x.beginPath();x.arc(0,H,210,0,7);x.fill();
 x.restore()}

function wrap(txt,maxW){
 const out=[];txt.split('\n').forEach(p=>{
  if(!p.trim()){out.push('');return}
  let line='';p.split(/\s+/).forEach(w=>{
   const t=line?line+' '+w:w;
   if(x.measureText(t).width<=maxW){line=t}
   else{if(line)out.push(line);
    if(x.measureText(w).width>maxW){let s='';for(const ch of w){if(x.measureText(s+ch).width>maxW){out.push(s);s=ch}else s+=ch}line=s}else line=w}
  });out.push(line)});return out}

function stamp(){
 const d=new Date(),f=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d),o={};
 f.forEach(p=>o[p.type]=p.value);
 return `${o.day} ${o.month} ${o.year} · ${o.hour}.${o.minute} WIB`}
