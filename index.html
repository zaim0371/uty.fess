<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menfess UTY</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#dff0fc;--bg2:#fde9f1;--card:#fff;--ink:#26405e;--mut:#6b86a3;--sky:#4a9fdc;--sky2:#3589c7;--pink:#ffc2d9;--line:#cfe5f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16273a;--bg2:#2a2030;--card:#1f3248;--ink:#e8f1fa;--mut:#9fb6cc;--line:#34506b}}
:root[data-theme="dark"]{--bg1:#16273a;--bg2:#2a2030;--card:#1f3248;--ink:#e8f1fa;--mut:#9fb6cc;--line:#34506b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:Nunito,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 18px 40px}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:30px;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mut);font-size:15px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
textarea{width:100%;min-height:150px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:transparent;outline:none}
textarea:focus-visible,button:focus-visible,label:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.cnt{font-size:13px;color:var(--mut)}
button,.ghost{font:inherit;font-weight:700;border-radius:999px;padding:12px 22px;border:0;cursor:pointer}
.go{background:var(--sky);color:#fff;flex:1}
.go:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-size:13px;padding:8px 14px;font-weight:600}
.ghost input{display:none}
.prev{margin-top:18px;text-align:center}
.prev img{width:100%;height:auto;border-radius:16px;border:1px solid var(--line);display:block}
.hint{font-size:13px;color:var(--mut);margin:10px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px;color:var(--ink);background:transparent;outline:none;min-width:0}
input[type=text]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
[hidden]{display:none!important}
.chip{flex:1;min-width:0;padding:10px 6px;font-size:14px;background:transparent;border:1.5px solid var(--line);color:var(--ink)}
#dz .chip:last-child:nth-child(odd){grid-column:1/-1}
.chip[aria-checked=true]{background:var(--sky);border-color:var(--sky);color:#fff}
.chip:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* ===== Liquid Glass (iOS 26) ===== */
body{background:
 radial-gradient(520px 420px at 12% 6%,rgba(255,176,208,.75),transparent 70%),
 radial-gradient(560px 460px at 95% 28%,rgba(90,168,226,.7),transparent 70%),
 radial-gradient(520px 460px at 8% 78%,rgba(142,201,241,.7),transparent 70%),
 radial-gradient(420px 360px at 92% 98%,rgba(255,194,217,.7),transparent 70%),
 linear-gradient(170deg,#cfe6fb,#fde6ef);background-attachment:fixed}
.box{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,.14) 55%,rgba(255,255,255,.3));
 -webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);
 border:1px solid rgba(255,255,255,.75);border-radius:30px;
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.3),0 14px 40px rgba(40,90,160,.18)}
textarea,input[type=text]{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.7);border-radius:20px;
 -webkit-backdrop-filter:blur(8px) saturate(1.5);backdrop-filter:blur(8px) saturate(1.5);
 box-shadow:inset 0 2px 6px rgba(40,90,160,.12),inset 0 1px 0 rgba(255,255,255,.8)}
textarea::placeholder,input::placeholder{color:var(--mut);opacity:.85}
.chip,.ghost{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.75);
 -webkit-backdrop-filter:blur(8px) saturate(1.5);backdrop-filter:blur(8px) saturate(1.5);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 14px rgba(40,90,160,.1)}
.chip[aria-checked=true]{background:linear-gradient(180deg,rgba(90,168,226,.85),rgba(53,137,199,.85));border-color:rgba(255,255,255,.85);color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 6px 18px rgba(53,137,199,.35)}
.go{background:linear-gradient(180deg,rgba(90,168,226,.92),rgba(53,137,199,.92));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 22px rgba(53,137,199,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(520px 420px at 12% 6%,rgba(255,120,170,.3),transparent 70%),radial-gradient(560px 460px at 95% 30%,rgba(60,130,210,.4),transparent 70%),linear-gradient(170deg,#12233a,#241a2e);background-attachment:fixed}
 :root:not([data-theme="light"]) .box{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,255,255,.1));border-color:rgba(255,255,255,.25)}
 :root:not([data-theme="light"]) textarea,:root:not([data-theme="light"]) input[type=text],:root:not([data-theme="light"]) .chip,:root:not([data-theme="light"]) .ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}}

.carw{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.75);box-shadow:0 12px 34px rgba(40,90,160,.22)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car img{flex:0 0 100%;width:100%;height:auto;display:block;border:0;border-radius:0;scroll-snap-align:center;scroll-snap-stop:always}
.badge{position:absolute;top:12px;right:12px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;background:rgba(20,40,70,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;padding:0;border-radius:50%;font-size:26px;line-height:1;color:#fff;background:rgba(20,40,70,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4)}
.nav.l{left:10px}.nav.r{right:10px}
@media (hover:none){.nav{display:none}}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sky);opacity:.3;transition:.2s}
.dots i.on{opacity:1;transform:scale(1.3)}

/* ===== Kontrol mode + pemilih desain + animasi ===== */
:root{--gl:rgba(255,255,255,.26);--gb:rgba(255,255,255,.75);--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);--acc:#3589c7;--acc2:#5aa8e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:rgba(255,255,255,.09);--gb:rgba(255,255,255,.24)}}
:root[data-theme="dark"]{--gl:rgba(255,255,255,.09);--gb:rgba(255,255,255,.24)}
.box[data-mode=a]{--acc:#d9628f;--acc2:#ff9fc4}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes swap{0%{opacity:.35;transform:scale(.95);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
@keyframes glow{0%,100%{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 22px color-mix(in srgb,var(--acc) 40%,transparent)}50%{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 10px 32px color-mix(in srgb,var(--acc) 65%,transparent)}}
h1,p.sub{animation:pop .7s var(--ease) both}p.sub{animation-delay:.08s}
.box{animation:rise .8s var(--ease) .12s both}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;margin-bottom:12px;border-radius:999px;background:var(--gl);border:1px solid var(--gb);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 2px 6px rgba(20,50,110,.14)}
.thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:999px;background-color:var(--acc);transition:transform .55s var(--spring),background-color .4s var(--ease),box-shadow .4s;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent)}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.seg[data-m=a] .thumb{transform:translateX(100%)}
.sb{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;background:transparent;color:var(--ink);opacity:.72;font-size:15px;transition:color .3s,opacity .3s,transform .25s var(--spring)}
.sb svg{width:19px;height:19px;flex:none;transition:transform .5s var(--spring)}
.sb[aria-checked=true]{color:#fff;opacity:1}
.sb[aria-checked=true] svg{transform:scale(1.12) rotate(-6deg)}
.sb:active{transform:scale(.95)}
.pick{margin-bottom:12px}
.pbtn{display:flex;align-items:center;gap:12px;width:100%;padding:9px 14px 9px 10px;text-align:left;border-radius:22px;background:var(--gl);border:1px solid var(--gb);color:var(--ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);transition:transform .25s var(--spring),border-color .3s,box-shadow .3s}
.pbtn:active{transform:scale(.98)}
.pick.open .pbtn{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.pl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.pl small{font-size:12px;font-weight:600;color:var(--mut)}.pl b{font-size:16px}
.chev{width:22px;height:22px;flex:none;transition:transform .5s var(--spring)}
.pick.open .chev{transform:rotate(180deg)}
.sw{display:block;width:40px;height:40px;flex:none;border-radius:13px;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(20,50,110,.2);transition:background .4s}
.s-g{background:radial-gradient(circle at 12% 12%,#2f7a3a 0 22%,transparent 24%),linear-gradient(160deg,#3578d6,#a8d0f6 70%,#ffc2d9)}
.s-a{background:linear-gradient(160deg,#5aa8e2,#8fc9f1)}
.s-b{background:linear-gradient(160deg,#ffdfeb,#fff1f6 60%,#8ec9f1)}
.s-c{background:linear-gradient(180deg,#5aa8e2 0 45%,#f6fbff 46%)}
.s-d{background:linear-gradient(160deg,#2a6db5,#5f94c7 55%,#8fc9f1)}
.s-f{background:radial-gradient(circle at 30% 80%,#fff 0 20%,transparent 22%),linear-gradient(180deg,#3a78d8,#c3def9)}
.plist{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .5s var(--ease),opacity .3s,visibility 0s .5s}
.pick.open .plist{grid-template-rows:1fr;opacity:1;visibility:visible;transition-delay:0s}
.pin{min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-top:8px}
.opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--gl);border:1.5px solid transparent;color:var(--ink);font-size:15px;text-align:left;transition:transform .25s var(--spring),background .3s,border-color .3s}
.opt .sw{width:30px;height:30px;border-radius:10px}
.opt span{flex:1;min-width:0}
.opt .ck{width:18px;height:18px;flex:none;color:var(--acc);opacity:0;transform:scale(.3);transition:.35s var(--spring)}
.opt[aria-selected=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.opt[aria-selected=true] .ck{opacity:1;transform:none}
.opt:active{transform:scale(.95)}
.pick.open .opt{animation:pop .45s var(--spring) both;animation-delay:calc(var(--i)*45ms + 80ms)}
.two:not([hidden]),#j:not([hidden]),#phrow:not([hidden]){animation:pop .5s var(--ease) both}
.go{background:linear-gradient(180deg,color-mix(in srgb,var(--acc2) 95%,#fff),var(--acc));transition:transform .25s var(--spring),background .4s,opacity .3s}
.go:not(:disabled){animation:glow 3s ease-in-out infinite}
.go:not(:disabled):active,.ghost:active{transform:scale(.96)}
.ghost{transition:transform .25s var(--spring),background .3s}
textarea,input[type=text]{transition:border-color .3s,box-shadow .3s,transform .3s var(--spring)}
textarea:focus,input[type=text]:focus{border-color:var(--acc)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 28%,transparent),inset 0 2px 6px rgba(40,90,160,.1)}
#pv:not([hidden]){animation:pop .6s var(--ease) both}
.carw.swap{animation:swap .55s var(--ease) both}
.dots i{width:7px;transition:width .4s var(--spring),opacity .3s,background .3s}
.dots i.on{width:22px;border-radius:6px;transform:none}
.badge,.nav{transition:opacity .3s,transform .3s var(--spring)}
.nav:active{transform:translateY(-50%) scale(.9)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <h1>Menfess UTY</h1>
  <p class="sub">Tempel teks menfess, lalu simpan gambarnya.</p>
  <div class="box" id="box" data-mode="m">
    <div class="seg" id="seg" data-m="m" role="radiogroup" aria-label="Pilih mode"><span class="thumb"></span>
      <button class="sb" type="button" role="radio" aria-checked="true" data-m="m"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 8l8 5.5L20 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Menfess</button>
      <button class="sb" type="button" role="radio" aria-checked="false" data-m="a"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4a1 1 0 001 1h2l7 4V5L7 9H5a1 1 0 00-1 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M18 9.5a4 4 0 010 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Admin</button></div>
    <div class="pick" id="pick"><button class="pbtn" id="dzbtn" type="button" aria-haspopup="listbox" aria-expanded="false"><i class="sw s-g" id="dzsw"></i><span class="pl"><small>Desain</small><b id="dzname">Menyatu</b></span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="plist"><div class="pin" id="dz" role="listbox" aria-label="Pilih desain"><button class="opt" type="button" role="option" aria-selected="true" data-d="g" style="--i:0"><i class="sw s-g"></i><span>Menyatu</span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="opt" type="button" role="option" aria-selected="false" data-d="a" style="--i:1"><i class="sw s-a"></i><span>Langit</span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="opt" type="button" role="option" aria-selected="false" data-d="b" style="--i:2"><i class="sw s-b"></i><span>Pink Lembut</span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="opt" type="button" role="option" aria-selected="false" data-d="c" style="--i:3"><i class="sw s-c"></i><span>Putih Bersih</span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="opt" type="button" role="option" aria-selected="false" data-d="d" style="--i:4"><i class="sw s-d"></i><span>Kampus</span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="opt" type="button" role="option" aria-selected="false" data-d="f" style="--i:5"><i class="sw s-f"></i><span>Langit Awan</span><svg class="ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div>
    <input type="text" id="j" maxlength="80" placeholder="Judul pengumuman" aria-label="Judul pengumuman" hidden style="margin-bottom:10px">
    <div class="two"><input type="text" id="f" maxlength="40" placeholder="from: (opsional)" aria-label="from"><input type="text" id="o" maxlength="40" placeholder="to: (opsional)" aria-label="to"></div>
    <textarea id="t" maxlength="2000" placeholder="Tempel atau tulis menfess di sini…"></textarea>
    <div class="row">
      <span class="cnt" id="c">0 / 2000</span>
    </div>
    <div class="row" id="phrow" hidden><label class="ghost">Upload foto latar<input type="file" id="ph" accept="image/*"></label><button class="ghost" id="phreset" type="button">Pakai foto bawaan</button></div>
    <div class="row"><button class="go" id="save" disabled>Simpan gambar</button><button class="ghost" id="save1" type="button" hidden>Simpan slide ini</button></div>
  </div>
  <div class="prev" id="pv" hidden>
    <div class="carw"><div class="car" id="car" aria-label="Slide gambar menfess"></div><span class="badge" id="badge" hidden></span><button class="nav l" id="nl" type="button" aria-label="Sebelumnya" hidden>&#8249;</button><button class="nav r" id="nr" type="button" aria-label="Berikutnya" hidden>&#8250;</button></div>
    <div class="dots" id="dots"></div>
    <p class="hint" id="hint">Jika tombol simpan tidak muncul, tahan gambar lalu pilih simpan.</p>
  </div>
</main>
<canvas id="cv" width="1080" height="1350" hidden></canvas>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=1080,H=1350;
const J=document.getElementById('j'),F=document.getElementById('f'),O=document.getElementById('o'),T=document.getElementById('t'),C=document.getElementById('c'),IM=document.getElementById('im'),PV=document.getElementById('pv'),SV=document.getElementById('save');

function spark(cx,cy,r,a,col){x.save();x.translate(cx,cy);x.globalAlpha=a;x.fillStyle=col||'#fff';x.beginPath();
 for(let i=0;i<8;i++){const ang=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;x.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}x.closePath();x.fill();x.restore()}

function drawLogo(cx,cy,R){
 x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
 if(logoImg){const s=Math.max(2*R/logoImg.width,2*R/logoImg.height)*1.04;x.drawImage(logoImg,cx-logoImg.width*s/2,cy-logoImg.height*s/2,logoImg.width*s,logoImg.height*s);x.restore();ring(cx,cy,R);return}
 x.fillStyle=NAVY;x.fillRect(cx-R,cy-R,2*R,2*R);
 // matahari
 const sg=x.createLinearGradient(0,cy,0,cy+R);sg.addColorStop(0,'#ffd23f');sg.addColorStop(1,'#ff8a2a');
 x.fillStyle=sg;x.beginPath();x.arc(cx,cy+R*.62,R*.5,Math.PI,0);x.fill();
 // globe
 const gr=R*.5,gy=cy+R*.06;
 const g=x.createLinearGradient(cx-gr,gy-gr,cx+gr,gy+gr);g.addColorStop(0,'#fff');g.addColorStop(1,'#5aa7e6');
 x.fillStyle=g;x.beginPath();x.arc(cx,gy,gr,0,7);x.fill();
 x.strokeStyle='#2f78c4';x.lineWidth=R*.025;
 x.beginPath();x.ellipse(cx,gy,gr*.45,gr,0,0,7);x.stroke();
 x.beginPath();x.moveTo(cx,gy-gr);x.lineTo(cx,gy+gr);x.moveTo(cx-gr,gy);x.lineTo(cx+gr,gy);x.stroke();
 // orbit atom
 x.strokeStyle='#e5322d';x.lineWidth=R*.055;
 [-35,35].forEach(d=>{x.beginPath();x.ellipse(cx,gy,gr*1.28,gr*.45,d*Math.PI/180,0,7);x.stroke()});
 x.restore();
 // bintang emas
 x.save();x.fillStyle='#f6c62b';x.beginPath();

const CAR=document.getElementById('car'),DOTS=document.getElementById('dots'),BADGE=document.getElementById('badge'),S1=document.getElementById('save1'),NL=document.getElementById('nl'),NR=document.getElementById('nr');
function cur(){return Math.min(OUT.length-1,Math.max(0,Math.round(CAR.scrollLeft/(CAR.clientWidth||1))))}
function mark(){const i=cur(),n=OUT.length;[...DOTS.children].forEach((d,k)=>d.classList.toggle('on',k===i));BADGE.textContent=(i+1)+'/'+n;NL.hidden=n<2||i===0;NR.hidden=n<2||i===n-1}
function show(){
 const n=OUT.length;
 while(CAR.children.length<n){const im=document.createElement('img');im.alt='Slide menfess';CAR.appendChild(im)}
 while(CAR.children.length>n)CAR.lastChild.remove();
 [...CAR.children].forEach((im,i)=>{im.src=OUT[i];im.alt='Slide '+(i+1)+' dari '+n});
 DOTS.innerHTML='';for(let i=0;i<n;i++)DOTS.appendChild(document.createElement('i'));
 DOTS.hidden=BADGE.hidden=n<2;S1.hidden=n<2;
 SV.textContent=n>1?'Simpan semua ('+n+' gambar)':'Simpan gambar';
 document.getElementById('hint').textContent=n>1?'Geser ke samping untuk melihat slide berikutnya.':'Jika tombol simpan tidak muncul, tahan gambar lalu pilih simpan.';
 PV.hidden=false;SV.disabled=false;mark()}
CAR.addEventListener('scroll',()=>{clearTimeout(CAR._t);CAR._t=setTimeout(mark,40)},{passive:true});
NL.addEventListener('click',()=>CAR.scrollTo({left:(cur()-1)*CAR.clientWidth,behavior:'smooth'}));
NR.addEventListener('click',()=>CAR.scrollTo({left:(cur()+1)*CAR.clientWidth,behavior:'smooth'}));
async function saveIdx(i,dl){
 const b=await (await fetch(OUT[i])).blob(),name=OUT.length>1?'menfess-uty-'+(i+1)+'.png':'menfess-uty.png';
 if(dl){await dl.save({filename:name,data:b});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
 await new Promise(r=>setTimeout(r,350))}
async function doSave(list){
 let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
 try{for(const i of list)await saveIdx(i,dl)}catch(e){return}
 const old=SV.textContent;SV.textContent='\u2713 Tersimpan';setTimeout(()=>{SV.textContent=old},1700)}
SV.addEventListener('click',()=>doSave(OUT.map((_,i)=>i)));
S1.addEventListener('click',()=>doSave([cur()]));
ready();
